<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aprende NestJS</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['Fraunces', 'serif'],
            mono: ['IBM Plex Mono', 'monospace'],
          },
          colors: {
            accent: '#c8392a',
            'accent-dark': '#8b1f14',
            done: '#2d6a2d',
          }
        }
      }
    }
  </script>
  <link rel="icon" type="image/x-icon" href="nestjs-icon.png">
  <meta name="description" content="Guía completa para aprender NestJS, el framework de Node.js para construir aplicaciones escalables y mantenibles.">
</head>
<body class="bg-amber-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-serif transition-colors duration-300">

<button id="menu-toggle" class="hidden fixed top-4 left-4 z-50 bg-accent text-white p-2 rounded-md font-mono text-sm md:hidden" onclick="toggleSidebar()">☰ Menú</button>

<button id="theme-toggle" class="fixed top-4 right-4 z-50 p-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-yellow-300 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors" onclick="toggleTheme()" title="Cambiar tema">
  <i id="sun-icon" class="fas fa-sun text-lg hidden"></i>
  <i id="moon-icon" class="fas fa-moon text-lg"></i>
</button>

<aside id="sidebar" class="fixed left-0 top-0 w-64 h-screen bg-white dark:bg-gray-800 border-r border-gray-300 dark:border-gray-700 overflow-y-auto flex flex-col md:relative md:flex transition-all duration-300 -translate-x-full md:translate-x-0">
  <div class="p-6 border-b border-gray-300 dark:border-gray-700">
    <div class="flex items-center gap-2.5 mb-4">
      <div class="w-8 h-8 bg-accent text-white font-mono text-sm font-bold flex items-center justify-center rounded">N</div>
      <div class="text-sm font-bold italic text-gray-900 dark:text-white">Aprende NestJS</div>
    </div>
    <div>
      <div class="flex justify-between font-mono text-xs text-gray-600 dark:text-gray-400 mb-1.5">
        <span>Progreso</span>
        <span id="prog-label">0 / 20</span>
      </div>
      <div class="h-1 bg-gray-300 dark:bg-gray-700 rounded">
        <div id="prog-fill" class="h-full bg-accent rounded transition-all duration-500" style="width:0%"></div>
      </div>
    </div>
  </div>
  <nav id="nav" class="flex-1 py-3 overflow-y-auto"></nav>
</aside>

<main id="content" class="md:ml-64 px-8 md:px-16 py-12 md:py-12 max-w-4xl overflow-y-auto h-screen"></main>

<script src="script.js"></script>
</body>
</html>
