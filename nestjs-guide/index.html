<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Guía completa para aprender NestJS, el framework de Node.js para construir aplicaciones escalables y mantenibles.">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <title>Aprende NestJS</title>
  <link rel="shortcut icon" href="nestjs-icon.svg" type="image/x-icon">
  <link rel="stylesheet" href="https://unpkg.com/@material-tailwind/html@latest/styles/material-tailwind.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['Roboto', 'serif'],
            mono: ['IBM Plex Mono', 'monospace'],
          },
          colors: {
            accent: '#c8392a',
            'accent-dark': '#8b1f14',
            done: '#2d6a2d',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 font-serif transition-colors duration-300">

<button id="menu-toggle" class="hidden fixed top-4 left-4 z-50 bg-accent text-white px-3 py-2 rounded-lg font-mono text-sm md:hidden hover:bg-accent-dark transition-colors" onclick="toggleSidebar()">
  <i class="fas fa-bars"></i> Menú
</button>

<button id="theme-toggle" class="fixed top-4 right-4 z-50 p-2.5 rounded-lg bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-yellow-300 hover:bg-slate-300 dark:hover:bg-slate-600 transition-colors shadow-md" onclick="toggleTheme()" title="Cambiar tema">
  <i id="sun-icon" class="fas fa-sun text-lg hidden"></i>
  <i id="moon-icon" class="fas fa-moon text-lg"></i>
</button>

<div class="flex h-screen">
  <aside id="sidebar" class="fixed left-0 top-0 h-screen w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 overflow-y-auto md:relative transition-all duration-300 z-40 -translate-x-full md:translate-x-0 md:shadow-lg shadow-slate-900/5">
    <div class="sticky top-0 bg-white dark:bg-slate-800 p-6 border-b border-slate-200 dark:border-slate-700">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10  from-accent to-accent-dark text-white font-mono text-sm font-bold flex items-center justify-center rounded-lg">
          <img src="nestjs-icon.svg" alt="nest-icon" class="w-6 h-6">
        </div>
        <h1 class="text-lg font-bold font-serif text-slate-900 dark:text-white">NestJS</h1>
      </div>
      <div class="space-y-2">
        <div class="flex justify-between font-mono text-xs text-slate-600 dark:text-slate-400">
          <span>Progreso</span>
          <span id="prog-label">0 / 20</span>
        </div>
        <div class="h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
          <div id="prog-fill" class="h-full bg-gradient-to-r from-accent to-accent-dark rounded-full transition-all duration-500" style="width:0%"></div>
        </div>
      </div>
    </div>
    <nav id="nav" class="flex-1 py-4 px-3 overflow-y-auto"></nav>
  </aside>

  <main id="content" class="flex-1 ml-0 md:ml-0 overflow-y-auto pt-16 md:pt-8 px-6 md:px-12 pb-8 max-w-5xl mx-auto w-full"></main>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
